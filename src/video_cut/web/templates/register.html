{% extends "base.html" %}

{% block title %}Register · video-cut{% endblock %}

{% block topbar_meta %}{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 80px auto; padding: 0 20px;">
  <div style="background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 32px;">
    <h1 style="margin: 0 0 8px; font-size: 22px;">Create Account</h1>
    <p style="color: var(--ink-dim); margin: 0 0 24px; font-size: 14px;">Register a new user account.</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="username" style="display: block; margin-bottom: 6px; color: var(--ink-dim); font-size: 13px;">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Choose a username" style="width: 100%;">
      </div>

      <div class="form-group">
        <label for="email" style="display: block; margin-bottom: 6px; color: var(--ink-dim); font-size: 13px;">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="your@email.com" style="width: 100%;">
      </div>

      <div class="form-group">
        <label for="password" style="display: block; margin-bottom: 6px; color: var(--ink-dim); font-size: 13px;">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Choose a strong password" style="width: 100%;">
      </div>

      <div class="form-group">
        <label for="role" style="display: block; margin-bottom: 6px; color: var(--ink-dim); font-size: 13px;">Role</label>
        <select id="role" name="role" style="width: 100%; background: var(--bg-deep); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 11px 13px; font-family: var(--sans); font-size: 14px;">
          <option value="editor">Editor (Default)</option>
          <option value="admin">Admin</option>
          <option value="viewer">Viewer</option>
        </select>
      </div>

      <div id="errorMsg" class="error" style="display: none; margin-bottom: 16px; padding: 10px; background: rgba(208, 96, 82, 0.1); border: 1px solid rgba(208, 96, 82, 0.3); border-radius: 6px;"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
    </form>

    <p class="hint" style="margin-top: 16px; text-align: center;">
      Already have an account? <a href="/login">Sign in here</a>
    </p>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = e.target.querySelector('button[type="submit"]');

  // Clear previous errors
  errorMsg.style.display = 'none';
  errorMsg.textContent = '';

  // Disable button during request
  submitBtn.disabled = true;
  submitBtn.textContent = 'Registering...';

  try {
    const response = await fetch('/auth/register', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ username, email, password, role })
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.detail || 'Registration failed');
    }

    // Registration successful - redirect to login
    window.location.href = '/login';
  } catch (error) {
    errorMsg.textContent = error.message;
    errorMsg.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Register';
  }
});
</script>
{% endblock %}
