<form hx-post="/videos/{{ stem }}/steps/{{ step.name }}"
      hx-target="#steps" hx-swap="outerHTML">
  {% if step.name == "analyze" %}
  <textarea name="prompt" rows="3"
            placeholder="自定义提示词（可选），如：找反转和笑点">{{ analyze_prompt or "" }}</textarea>
  {% endif %}
  <div class="row">
    <button class="btn" type="submit" {% if task_running %}disabled{% endif %}>运行</button>
    <button class="btn btn-ghost" type="submit" name="force" value="true" {% if task_running %}disabled{% endif %}>强制重跑</button>
  </div>
</form>
